name: allowance_app_v2
description: "Allowance Claim Portal v2 - local only (no Drive sync)"
publish_to: 'none'
version: 2.0.13+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  intl: ^0.20.2
  share_plus: 12.0.0
  file_picker: 11.0.3
  pdf: ^3.12.0
  printing: ^5.14.3
  pdfx: '>=2.9.2 <2.11.0'
  allowance_shared:
    path: ../shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
